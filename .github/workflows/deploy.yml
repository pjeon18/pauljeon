name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install deps
        working-directory: ./site
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      
      # the React site now lives one level down, at /pauljeon/classic/
      - name: Build
        working-directory: ./site
        env:
          BASE_PATH: "/pauljeon/classic/"
        run: npm run build

      # the card home (static, in home/) at /pauljeon/, the React site under it at /classic/.
      # 404.html is the React app plus a redirect, so old links (/pauljeon/work/iso) land on
      # /pauljeon/classic/work/iso and deep links inside /classic/ still render.
      - name: Assemble
        run: |
          mkdir -p out
          cp -R home/. out/
          cp -R site/dist out/classic
          python3 - <<'PY'
          src = open('out/classic/index.html').read()
          hop = """<script>(function(){var p=location.pathname,b='/pauljeon/';if(p.indexOf(b+'classic/')!==0&&p.indexOf(b)===0){location.replace(b+'classic/'+p.slice(b.length)+location.search+location.hash)}})()</script>"""
          open('out/404.html', 'w').write(src.replace('<head>', '<head>' + hop, 1))
          # every route gets its own copy of the app, so /classic/work/iso is a real page (200), not the 404 fallback
          import re, os
          slugs = sorted(set(re.findall(r"slug: '([a-z0-9-]+)'", open('site/src/content/site.ts').read())))
          routes = ['box', 'human-inventory', 'impostor', 'work/iso-redesign/brand', 'work/iso-redesign/process'] + ['work/' + s for s in slugs]
          for r in routes:
              os.makedirs('out/classic/' + r, exist_ok=True)
              open('out/classic/' + r + '/index.html', 'w').write(src)
          print('route pages:', len(routes))
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

